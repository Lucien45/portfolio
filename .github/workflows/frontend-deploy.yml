name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: ./client
      run: npm ci

    - name: Build frontend
      working-directory: ./client
      run: npm run build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}

    - name: Prepare directories on VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          if [ ! -d "/home/ubuntu/deploiment/portfolio/client" ]; then
            mkdir -p /home/ubuntu/deploiment/portfolio/client
            echo "client directory created"
          else
            echo "client directory already exists, skipping"
          fi

    - name: Copy files to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        source: "client/Dockerfile,client/nginx/"
        target: "/home/ubuntu/deploiment/portfolio/client/"
        strip_components: 1

    - name: Copy build files to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        source: "client/build/"
        target: "/home/ubuntu/deploiment/portfolio/client/"
        strip_components: 1

    - name: Copy docker-compose to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        source: "docker-compose.yml"
        target: "/home/ubuntu/deploiment/portfolio/"

    - name: SSH & Deploy Docker Compose
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          cd /home/ubuntu/deploiment/portfolio/
          docker-compose down --remove-orphans || true
          docker network prune -f
          docker-compose up -d --build